<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Order | Sonder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500&family=Bodoni+Moda:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="img/sonder-logo.png" alt="Sonder"></a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">&#9776;</button>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
    </nav>
  </div>
</header>

<section style="padding-top:44px;">
  <div class="wrap">
    <span class="eyebrow">Almost there</span>
    <h1 style="margin-top:6px;">Complete your order</h1>

    <div id="load-error" class="notice notice-error hidden" style="margin-top:16px;"></div>

    <form id="order-form" class="checkout-layout mt-lg">
      <div>
        <div class="card">
          <h3>Your details</h3>
          <div class="form-grid">
            <div><label for="name">Full name</label><input id="name" required /></div>
            <div><label for="contact">Contact number</label><input id="contact" type="tel" required /></div>
            <div><label for="email">Email (for receipt)</label><input id="email" type="email" required /></div>
            <div><label for="altcontact">Alternative contact (optional)</label><input id="altcontact" type="tel" /></div>
            <div class="full"><label for="address">Delivery address</label><textarea id="address" required></textarea></div>
            <div><label for="landmark">Landmark</label><input id="landmark" /></div>
            <div><label for="pincode">Pincode</label><input id="pincode" inputmode="numeric" required /></div>
            <div><label for="slot">Preferred delivery time slot</label>
              <select id="slot" required><option value="">Loading slots…</option></select>
            </div>
            <div><label for="qty">Quantity</label>
              <select id="qty">
                <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
              </select>
            </div>
            <div class="full"><label for="instructions">Special instructions (optional)</label>
              <textarea id="instructions" placeholder="Less spicy, call before arriving, etc."></textarea>
            </div>
          </div>
        </div>
      </div>

      <aside class="order-summary">
        <h3>Order summary</h3>
        <div class="summary-row"><span id="sum-dish-name">Dish</span><span id="sum-dish-price">₹0</span></div>
        <div class="summary-row"><span>Quantity</span><span id="sum-qty">1</span></div>
        <div class="summary-row"><span>Delivery fee</span><span id="sum-delivery">Enter pincode</span></div>
        <div class="summary-row total"><span>Total</span><span id="sum-total">₹0</span></div>
        <p id="zone-msg" class="muted" style="font-size:0.85rem; margin-top:10px;"></p>
        <button type="submit" id="pay-btn" class="btn-solid" style="width:100%; margin-top:16px;" disabled>
          Pay &amp; place order
        </button>
        <p class="muted" style="font-size:0.8rem; margin-top:10px;">Secure payment via Razorpay. You'll get an email receipt right after.</p>
      </aside>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap footer-row">
    <span>&copy; <span id="year"></span> Sonder, Cox Town, Bangalore</span>
    <nav style="display:flex; gap:20px;"><a href="about.html">About</a><a href="menu.html">Today's Dish</a></nav>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/sheet-data.js"></script>
<script src="js/checkout.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
  const toggle = document.querySelector(".nav-toggle");
  const nav = document.querySelector(".main-nav");
  toggle.addEventListener("click", () => {
    const open = nav.classList.toggle("open");
    toggle.setAttribute("aria-expanded", open);
  });
</script>
</body>
</html>
